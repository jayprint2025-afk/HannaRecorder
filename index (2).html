<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Hanna Voice Dataset</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial;background:#f4f7fb;color:#172033}main{max-width:720px;margin:auto;padding:18px}.card{background:white;border-radius:20px;padding:20px;margin:12px 0;box-shadow:0 6px 24px #0001}.prompt{text-align:center;font-size:34px;font-weight:800;padding:24px}.badge{font-weight:800}.pos{color:#176b36}.neg{color:#9b2525}button,input{width:100%;padding:15px;border-radius:12px;margin-top:9px;font-size:16px}button{border:0;font-weight:700}.primary{background:#172033;color:white}.secondary{background:#edf1f7}.ok{background:#dff7e5}.danger{background:#ffe1e1}.hidden{display:none}progress{width:100%;height:18px}.note{background:#fff7d6;padding:12px;border-radius:12px}</style></head><body><main>
<div class="card"><h1>🎙️ Ayúdanos a entrenar a Hanna</h1><p>Grabarás <b>40 muestras</b>: 20 positivas y 20 negativas. Usa tu voz natural.</p><p class="note">No menciones pacientes, teléfonos, diagnósticos ni información personal.</p><label>Identificador anónimo</label><input id="speaker" placeholder="Ej. voz-03"></div>
<div class="card" id="session"><div id="badge" class="badge"></div><div id="phrase" class="prompt"></div><p id="tip"></p><progress id="progress" max="40"></progress><p id="counter"></p><p id="status">Listo para grabar.</p><button id="record" class="primary">🎤 Grabar</button><button id="play" class="secondary hidden">▶️ Escuchar</button><button id="accept" class="ok hidden">✅ Guardar y continuar</button><button id="retry" class="danger hidden">🔁 Repetir</button></div>
<div class="card hidden" id="done"><h2>✅ Terminaste</h2><p>Descarga el ZIP y envíalo por WhatsApp a quien te compartió este enlace.</p><button id="download" class="primary">⬇️ Descargar ZIP</button><p id="zipStatus"></p></div>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script><script>
const P=["Hanna","Hanna","Hanna","Hanna","Hanna","Oye Hanna","Oye Hanna","Oye Hanna","Oye Hanna","Oye Hanna","Hanna","Hanna","Hanna","Hanna","Hanna","Oye Hanna","Oye Hanna","Oye Hanna","Oye Hanna","Oye Hanna"];
const N=["Ana","Ana","Oye Ana","Oye Ana","Hermana","Hermana","Hola","Oye","Buenos días","¿Me escuchas?","Hola, buenas noches","Oye, ven","Buenas tardes","Abre la agenda","Tengo una cita mañana","¿Qué hora es?","Hola asistente","Oye asistente","Hermana, ven","Ana, ¿me escuchas?"];
const tasks=[];for(let i=0;i<20;i++){tasks.push({label:"positive",phrase:P[i]});tasks.push({label:"near-negative",phrase:N[i]})}
let idx=0,stream,rec,chunks=[],blob,saved=[];const $=x=>document.getElementById(x);
function render(){if(idx>=40){$("session").classList.add("hidden");$("done").classList.remove("hidden");return}let t=tasks[idx],p=t.label==="positive";$("badge").textContent=p?"POSITIVO — debe activar Hanna":"NEGATIVO — NO debe activar Hanna";$("badge").className="badge "+(p?"pos":"neg");$("phrase").textContent="“"+t.phrase+"”";$("tip").textContent=p?"Dilo natural; puedes variar un poco distancia, volumen o velocidad.":"Di exactamente la frase. No agregues “Hanna”.";$("progress").value=idx;$("counter").textContent=`Grabación ${idx+1} de 40`;$("status").textContent="Listo para grabar.";$("record").textContent="🎤 Grabar";$("record").classList.remove("hidden");["play","accept","retry"].forEach(x=>$(x).classList.add("hidden"))}
async function mic(){if(!stream)stream=await navigator.mediaDevices.getUserMedia({audio:true});return stream}
$("record").onclick=async()=>{if(rec&&rec.state==="recording"){rec.stop();return}try{let s=await mic();chunks=[];let type=["audio/webm;codecs=opus","audio/webm","audio/mp4"].find(x=>MediaRecorder.isTypeSupported(x));rec=type?new MediaRecorder(s,{mimeType:type}):new MediaRecorder(s);rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};rec.onstop=()=>{blob=new Blob(chunks,{type:rec.mimeType});$("status").textContent="Grabación lista.";$("record").classList.add("hidden");["play","accept","retry"].forEach(x=>$(x).classList.remove("hidden"))};rec.start();$("record").textContent="⏹️ Detener";$("status").textContent="Grabando…"}catch(e){alert("Permite el acceso al micrófono en Chrome. "+e.message)}};
$("play").onclick=()=>new Audio(URL.createObjectURL(blob)).play();$("retry").onclick=()=>{blob=null;render()};$("accept").onclick=()=>{if(blob){saved.push({task:tasks[idx],blob,index:idx+1});idx++;blob=null;render()}};
$("download").onclick=async()=>{let speaker=($("speaker").value||"voz").replace(/[^a-z0-9_-]/gi,"-"),z=new JSZip(),pos=z.folder("positive"),neg=z.folder("near-negative"),manifest=[];saved.forEach((x,i)=>{let ext=x.blob.type.includes("mp4")?"m4a":"webm",name=`${speaker}_${x.task.label}_${String(i+1).padStart(2,"0")}.${ext}`;(x.task.label==="positive"?pos:neg).file(name,x.blob);manifest.push({speaker,label:x.task.label,phrase:x.task.phrase,file:name})});z.file("manifest.json",JSON.stringify(manifest,null,2));$("zipStatus").textContent="Generando ZIP…";let out=await z.generateAsync({type:"blob"}),a=document.createElement("a");a.href=URL.createObjectURL(out);a.download=`Hanna_${speaker}.zip`;a.click();$("zipStatus").textContent="ZIP generado. Envíalo por WhatsApp."};render();
</script></main></body></html>
